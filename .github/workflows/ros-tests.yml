name: ROS Tests

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: r2ta
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: nix build
        run: nix build --print-build-logs
  ros-tests:
    needs: build
    strategy:
      matrix:
        ros_distro: [jazzy, kilted, lyrical, rolling]
      fail-fast: false
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: ./test}}
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v16
        with:
          name: r2ta
      - name: Get Ros2TraceAnalyzer from the build job
        working-directory: .
        run: |
          mkdir -p target/debug
          ln -s "$(nix build --no-link --print-out-paths)/bin/Ros2TraceAnalyzer" target/debug/
      - name: "Configure Nix binary cache"
        run: |
          mkdir -p ~/.config/nix
          cat >> ~/.config/nix/nix.conf <<EOF
          extra-substituters = https://attic.iid.ciirc.cvut.cz/ros?priority=42
          extra-trusted-public-keys = ros:JR95vUYsShSqfA1VTYoFt1Nz6uXasm5QrcOsGry9f6Q=
          EOF
      - name: Update to latest nix-ros-overlay
        run: nix-shell -p niv --command 'niv update'
      - name: Install ROS via Nix
        run: nix-shell --argstr distro ${{ matrix.ros_distro }} --run true
      - name: Run test suite
        env: {TERM: xterm-256color}
        run: nix-shell --argstr distro ${{ matrix.ros_distro }} --run "./test.bats -F pretty"
